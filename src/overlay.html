<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Snipzi capture</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; cursor: crosshair; user-select: none; -webkit-user-select: none; }
  #frame { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; display: block; }
  #dim { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.35); }
  #sel { position: absolute; display: none; box-sizing: border-box; border: 1px solid #fff; outline: 1px dashed #6c4ae6; box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.45); }
  #tag { position: absolute; display: none; padding: 2px 6px; font: 12px "Segoe UI", sans-serif; color: #fff; background: rgba(20, 20, 30, 0.85); border-radius: 4px; white-space: nowrap; pointer-events: none; }
  #bar { position: absolute; display: none; padding: 6px 10px; font: 13px "Segoe UI", sans-serif; color: #fff; background: rgba(20, 20, 30, 0.92); border-radius: 8px; white-space: nowrap; cursor: default; }
  #bar button { margin-left: 8px; padding: 3px 10px; border: 0; border-radius: 5px; font: inherit; cursor: pointer; }
  #bar .go { background: linear-gradient(135deg, #ff5d7a, #6c4ae6); color: #fff; }
  #bar .no { background: #3a3a4a; color: #fff; }
  .rbox { position: absolute; background: #000; box-sizing: border-box; outline: 1px solid rgba(255, 255, 255, 0.5); }
  #hint { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); padding: 6px 12px; font: 13px "Segoe UI", sans-serif; color: #fff; background: rgba(20, 20, 30, 0.85); border-radius: 8px; pointer-events: none; }
</style>
</head>
<body>
<canvas id="frame"></canvas>
<div id="dim"></div>
<div id="sel"></div>
<div id="tag"></div>
<div id="hint">Drag to select. Esc or right-click to cancel.</div>
<div id="bar"><span id="bartext"></span><button class="go" id="done">Done (Enter)</button><button class="no" id="cancel">Cancel (Esc)</button></div>
<script src="overlay.js"></script>
</body>
</html>
